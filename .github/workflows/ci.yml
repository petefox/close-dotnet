name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build Close.DotNet.slnx --configuration Release --no-restore
      - run: dotnet test --solution Close.DotNet.slnx --configuration Release --no-build

  package:
    name: Package and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - run: python3 scripts/coverage.py
      - run: dotnet restore --locked-mode
      - run: dotnet build Close.DotNet.slnx --configuration Release --no-restore
      - run: bash scripts/pack.sh artifacts/packages
      - name: Run a clean package consumer on .NET 10 and 11
        run: |
          package=(artifacts/packages/Close.DotNet.[0-9]*.nupkg)
          version="${package[0]#artifacts/packages/Close.DotNet.}"
          bash scripts/smoke-package.sh "${version%.nupkg}" artifacts/packages net10.0 net11.0
          CLOSE_SMOKE_ASPNETCORE=1 bash scripts/smoke-package.sh "${version%.nupkg}" artifacts/packages net10.0 net11.0
      - run: dotnet tool restore
      - run: dotnet docfx docs/docfx.json --warningsAsErrors

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
