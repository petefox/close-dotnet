name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable GitHub release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - name: Download the previously tested immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          gh release verify "$TAG"
          gh release download "$TAG" --dir artifacts/nuget --pattern 'Close.DotNet.*' --pattern SHA256SUMS
          (cd artifacts/nuget && sha256sum --check SHA256SUMS)
          for asset in artifacts/nuget/Close.DotNet.*; do
            gh release verify-asset "$TAG" "$asset"
          done
      - name: Obtain a short-lived NuGet key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages and symbols
        env:
          NUGET_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          feed=https://api.nuget.org/v3/index.json
          version="${TAG#v}"
          core="artifacts/nuget/Close.DotNet.$version.nupkg"
          dotnet nuget push "$core" --source "$feed" --api-key "$NUGET_KEY"
          webhooks="artifacts/nuget/Close.DotNet.AspNetCore.$version.nupkg"
          if [[ -f "$webhooks" ]]; then
            dotnet nuget push "$webhooks" --source "$feed" --api-key "$NUGET_KEY"
          fi
      - name: Verify installation from NuGet.org
        env:
          TAG: ${{ inputs.tag }}
        run: |
          feed=https://api.nuget.org/v3/index.json
          version="${TAG#v}"

          wait_for_package() {
            local id="$1"
            local url="https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"
            for attempt in {1..60}; do
              if curl -fsS --max-time 15 "$url" --output /dev/null 2>/dev/null; then
                return 0
              fi
              sleep 15
            done
            echo "::error::$id $version was pushed and is still unavailable in the public feed."
            return 1
          }

          wait_for_package close.dotnet
          bash scripts/smoke-package.sh "$version" "$feed" net10.0 net11.0
          if [[ -f "artifacts/nuget/Close.DotNet.AspNetCore.$version.nupkg" ]]; then
            wait_for_package close.dotnet.aspnetcore
            CLOSE_SMOKE_ASPNETCORE=1 bash scripts/smoke-package.sh "$version" "$feed" net10.0 net11.0
          fi
