name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected version tag, for example v1.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the tagged source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          git merge-base --is-ancestor "refs/tags/$TAG" HEAD
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - name: Reconcile the coverage inventory
        env:
          TAG: ${{ inputs.tag }}
        run: |
          args=(--upstream)
          [[ "$TAG" == *-beta.* ]] || args+=(--stable)
          python3 scripts/coverage.py "${args[@]}"
          if [[ "$TAG" != *-beta.* && -f scripts/generate-endpoints.py ]]; then
            spec="$(mktemp)"
            trap 'rm -f "$spec"' EXIT
            curl --fail --silent --show-error --max-time 30 https://api.close.com/api/openapi.json --output "$spec"
            python3 scripts/generate-endpoints.py "$spec" --check
          fi
      - run: dotnet restore --locked-mode
      - run: dotnet build Close.DotNet.slnx --configuration Release --no-restore
      - run: dotnet test --solution Close.DotNet.slnx --configuration Release --no-build
      - name: Pack the tagged build
        run: |
          if [[ -f scripts/pack.sh ]]; then
            bash scripts/pack.sh artifacts/release
          else
            dotnet pack src/Close.DotNet --configuration Release --no-build --output artifacts/release
          fi
      - name: Check package version and run the consumer smoke tests
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          test -f "artifacts/release/Close.DotNet.$version.nupkg"
          test -f "artifacts/release/Close.DotNet.$version.snupkg"
          bash scripts/smoke-package.sh "$version" artifacts/release net10.0 net11.0
          if [[ -f src/Close.DotNet.AspNetCore/Close.DotNet.AspNetCore.csproj ]]; then
            test -f "artifacts/release/Close.DotNet.AspNetCore.$version.nupkg"
            test -f "artifacts/release/Close.DotNet.AspNetCore.$version.snupkg"
            CLOSE_SMOKE_ASPNETCORE=1 bash scripts/smoke-package.sh "$version" artifacts/release net10.0 net11.0
          fi
          cp docs/coverage.md artifacts/release/endpoint-coverage.md
          awk -v heading="## $version" '$0 == heading { found=1; next } /^## / && found { exit } found' CHANGELOG.md > artifacts/release/release-notes.md
          grep -q '[^[:space:]]' artifacts/release/release-notes.md
          (cd artifacts/release && sha256sum Close.DotNet.* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: artifacts/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release
      - name: Publish the immutable GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          args=()
          [[ "$TAG" != *-beta.* ]] || args+=(--prerelease)
          gh release create "$TAG" Close.DotNet.* endpoint-coverage.md SHA256SUMS \
            --verify-tag --draft --title "$TAG" --notes-file release-notes.md "${args[@]}"
          gh release edit "$TAG" --draft=false
          # The attestation may take a few seconds to appear after publication.
          for attempt in {1..12}; do
            if gh release verify "$TAG"; then exit 0; fi
            sleep 5
          done
          exit 1
